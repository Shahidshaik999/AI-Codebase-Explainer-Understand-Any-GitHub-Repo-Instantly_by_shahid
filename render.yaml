services:
  - type: web
    name: codebase-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LLM_PROVIDER
        value: grok
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: GROK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        value: ""
      - key: GEMINI_API_KEY
        value: ""
      - key: CLONE_BASE_DIR
        value: /tmp/repos
      - key: FAISS_INDEX_DIR
        value: /tmp/faiss
      - key: MAX_FILE_SIZE_KB
        value: "100"
      - key: MAX_FILES_PER_REPO
        value: "50"
      - key: MAX_CHUNKS
        value: "15"
      - key: CHUNK_SIZE_LINES
        value: "80"
    plan: free
